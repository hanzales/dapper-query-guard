name: Release packages
on:
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack -c Release --output artifacts/packages
      # Publishing is intentionally left for an explicit, separately reviewed change.
