name: Release packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore --configfile NuGet.config
      - name: Build
        run: dotnet build DapperQueryGuard.slnx -c Release --no-restore
      - name: Test
        run: dotnet test DapperQueryGuard.slnx -c Release --no-build
      - name: Pack libraries
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/DapperQueryGuard.Core/DapperQueryGuard.Core.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/DapperQueryGuard.Schema/DapperQueryGuard.Schema.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/DapperQueryGuard.Analyzers/DapperQueryGuard.Analyzers.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/DapperQueryGuard.CodeFixes/DapperQueryGuard.CodeFixes.csproj -c Release --no-build -o artifacts/packages
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ilhanemir
      - name: Publish packages
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
